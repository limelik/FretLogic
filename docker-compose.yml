services:
  postgres:
    image: postgres:16-alpine
    container_name: fretlogic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fretlogic}
      POSTGRES_USER: ${POSTGRES_USER:-fretlogic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fretlogic}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: fretlogic-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fretlogic}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fretlogic}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fretlogic}
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key-for-production}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4173,http://localhost:5173,http://localhost:5174,http://127.0.0.1:4173,http://127.0.0.1:5173,http://127.0.0.1:5174
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: fretlogic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:4173"

volumes:
  postgres-data:
